# Build the .deb and a self-contained AppImage and attach them to the GitHub
# release. The tag must match __version__ in src/cursor_speak/__init__.py.
#
# Ubuntu 22.04 is the build base so the bundled glibc is old enough for the
# AppImageHub test image (and any later distro).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils zsync patchelf file libfuse2 \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 \
            libgtk-3-dev libgirepository1.0-dev librsvg2-dev pkg-config \
            xvfb x11-utils dbus-x11

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/cursor_speak/__init__.py)"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2; exit 1; }

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Build .deb
        run: ./build-deb.sh

      - name: Build AppImage
        run: ./build-appimage.sh

      - name: Check AppStream URLs (informational)
        continue-on-error: true
        run: appstreamcli validate build/AppDir/usr/share/metainfo/io.github.weaponx69.CursorSpeak.appdata.xml

      - name: Smoke-test the AppImage
        run: |
          chmod +x dist-appimage/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist-appimage/Cursor_Speak-*-x86_64.AppImage --version
          # A visible main window is required by AppImageHub (error-no-window).
          xvfb-run -a -s "-screen 0 1024x768x24" dbus-run-session -- \
            ./packaging/appimage/smoke-window.sh ./dist-appimage/Cursor_Speak-*-x86_64.AppImage

      - name: Checksums
        run: |
          mkdir -p release
          cp dist-deb/*.deb dist-appimage/*.AppImage dist-appimage/*.AppImage.zsync release/
          cd release && sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: cursor-speak-packages
          path: release/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
